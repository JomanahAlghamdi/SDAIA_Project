name: Local contracts and MCP
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.4"
      - run: uv python install 3.12
      - run: uv sync --locked
      - run: uv run python scripts/verify_local.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-contracts-${{ matrix.os }}
          path: results/local/
  submission-evidence:
    needs: contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.4"
      - run: uv python install 3.12
      - run: uv sync --locked
      - name: Verify submitted evaluation evidence against current source
        run: uv run python scripts/readiness.py --require-live
