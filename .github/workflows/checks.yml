name: Local contracts and MCP
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.4"
      - run: uv python install 3.12
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: uv run python app.py doctor
      - run: uv run python -m evals.security --mode replay
