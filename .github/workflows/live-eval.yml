name: Live model evaluation (manual)
on:
  push:
    paths:
      - .github/live-eval-request.json
  workflow_dispatch:
    inputs:
      model:
        description: "Concrete free OpenRouter tool-calling model ID"
        required: true
        type: string
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: ${{ inputs.model || 'google/gemma-4-31b-it:free' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.4"
      - run: uv python install 3.12
      - run: uv sync --locked
      - run: uv run python -m evals.run --config A B --trials 1
      - run: uv run python -m evals.security --mode live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-evaluation-evidence
          path: results/
